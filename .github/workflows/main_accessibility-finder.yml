# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - accessibility-finder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build WebAPI/WebAPI.csproj --configuration Release

      - name: Test it
        run: dotnet test

      - name: dotnet publish
        run: dotnet publish WebAPI/WebAPI.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp
          
      - name: dotnet publish WebApp
        run: dotnet publish WebApp/WebApp.csproj -c Release -o "${{env.DOTNET_ROOT}}/mywebapp"
    
      - name: Upload WebApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{env.DOTNET_ROOT}}/mywebapp

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'accessibility-finder'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
  
  
  deploy-webapp:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download WebApp artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp

      - name: Deploy WebApp artifact
        uses: azure/webapps-deploy@v3
        with:
          app-name: accessibility-finder-web      
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
